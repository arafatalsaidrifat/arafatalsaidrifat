function toast(msg,kind=''){let e=document.createElement('div');e.className='toast '+kind;e.textContent=msg;document.getElementById('toastwrap').append(e);setTimeout(()=>e.remove(),3400)}function status(s){let c=({'Pending':'pending','Confirmed':'confirmed','Processing':'processing','Packed':'packed','Shipped':'shipped','In transit':'in-transit','Delivered':'delivered','Cancelled':'cancelled','Verified':'verified','Rejected':'rejected','Review':'review','Booked':'booked','Open':'neutral','Needs human':'review','Resolved':'neutral','Failed':'failed'})[s]||'neutral';return `<span class="status ${c}">${esc(s)}</span>`}function customer(id){return state.customers.find(c=>c.id===id)||{name:'Unknown customer',phone:'',location:''}}function product(id){return state.products.find(p=>p.id===id)||{name:'Removed product',price:0,emoji:'📦'}}function orderSubtotal(o){return o.items.reduce((a,[id,q])=>a+product(id).price*q,0)}function orderTotal(o){return orderSubtotal(o)+o.shipping}function orderItemNames(o){return o.items.map(([id,q])=>`${product(id).name}${q>1?' ×'+q:''}`).join(', ')}function avatar(c,extra=''){let colors=['','orange','green','pink','purple'];let idx=Math.abs((c.name||'A').charCodeAt(0))%colors.length;return `<div class="miniavatar ${extra||colors[idx]}">${esc(initials(c.name||'?'))}</div>`}function go(p){page=p;if(p==='Inbox')mobileInboxView='list';document.querySelectorAll('.navitem').forEach(b=>b.classList.toggle('active',b.dataset.page===p));document.getElementById('topPageName').textContent=p;document.getElementById('sidebar').classList.remove('open');document.getElementById('mobileOverlay').classList.remove('show');render();window.scrollTo(0,0)}function head(eyebrow,title,desc,actions=''){return `<div class="headingrow"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p class="subheading">${desc}</p></div><div class="heading-actions">${actions}</div></div>`}function btn(txt,action,cls=''){return `<button class="btn ${cls}" data-action="${action}">${txt}</button>`}function kpi(label,value,icon,theme,foot){return `<div class="card kpi"><div class="kpihead">${label}<span class="kpi-icon ${theme}">${icon}</span></div><div class="kpi-value">${value}</div><div class="kpi-foot">${foot}</div></div>`}function svgChart(){let vals=chartRange==='Last 30 days'?[8,16,12,19,24,18,29,34,26,39,44,35,50,45,53,60,54,68,72,63,79,74,84,91,78,96]:chartRange==='This month'?[7,11,20,16,28,24,36,31,42,45,40,57,53,64,59,73,69,80,75,91,86,97]:[13,22,18,31,27,40,35,50,45,63,56,74,68,91,82,97];let pts=vals.map((v,i)=>`${i*100/(vals.length-1)},${110-v}`).join(' ');let area=`0,110 ${pts} 100,110`;return `<svg class="chart" viewBox="0 0 100 115" preserveAspectRatio="none" role="img" aria-label="Demo sales trend chart"><defs><linearGradient id="area" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#596be9" stop-opacity=".2"/><stop offset="100%" stop-color="#596be9" stop-opacity="0"/></linearGradient></defs>${[20,45,70,95].map(y=>`<line x1="0" x2="100" y1="${y}" y2="${y}" stroke="#edf0f5" stroke-width=".6"/>`).join('')}<polygon points="${area}" fill="url(#area)"/><polyline points="${pts}" fill="none" stroke="#5869e8" stroke-width="1.8" vector-effect="non-scaling-stroke" stroke-linecap="round" stroke-linejoin="round"/><polyline points="0,97 15,88 27,93 40,76 53,83 65,70 76,76 88,56 100,60" fill="none" stroke="#67c9a7" stroke-width="1.5" vector-effect="non-scaling-stroke" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 2"/></svg>`}
function renderOverview(){let pending=state.orders.filter(o=>o.status==='Pending').length,low=state.products.filter(p=>p.stock<=p.low).length,rev=state.orders.filter(o=>o.status==='Delivered').reduce((a,o)=>a+o.total,0)+state.orders.filter(o=>['Shipped','Packed','Processing','Confirmed'].includes(o.status)).reduce((a,o)=>a+o.total*.55,0);let recent=[...state.orders].sort((a,b)=>new Date(b.created)-new Date(a.created)).slice(0,5);let lowp=state.products.filter(p=>p.stock<=p.low).slice(0,4);let openC=state.conversations.filter(c=>c.status!=='Resolved');return `${head('TUESDAY, YOUR WORKSPACE AT A GLANCE','Good evening, Arafat 👋','Here’s what’s happening across your social-commerce operations today.',btn('＋ Create order','create-order','primary')+btn('Review payments','goto-payments'))}<div class="grid kpis">${kpi("Today's orders",state.orders.filter(o=>new Date(o.created).toDateString()===new Date().toDateString()).length,'▣','blue','<span class="delta">↑ 12.8%</span> vs yesterday')}${kpi('Sales pipeline',money(rev),'৳','green','<span class="delta">↑ 8.4%</span> vs last 7 days')}${kpi('Needs confirmation',pending,'◷','amber',`<span class="delta down">${pending} orders</span> waiting for review`)}${kpi('Low stock items',low,'◈','violet',`<span class="delta down">${low} SKUs</span> at reorder threshold`)}</div><div class="grid middle-grid"><section class="card"><div class="cardhead"><div><div class="cardtitle">Sales performance</div><div class="cardsub">Order revenue trend · Demo sample</div></div><select class="select" id="chartRange">${['Last 7 days','Last 30 days','This month'].map(s=>`<option ${chartRange===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="chartbox"><div class="chartleg"><span><i class="legenddot"></i>Sales (BDT)</span><span><i class="legenddot mint"></i>Orders</span><span style="margin-left:auto">${chartRange==='Last 7 days'?'Recent 7 days':chartRange==='Last 30 days'?'Recent 30 days':'Current month'} · sample</span></div>${svgChart()}<div style="display:flex;justify-content:space-between;font-size:9px;color:#97a1b0;padding:5px 3px 0"><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span></div></div></section><section class="card orderside"><div class="cardhead"><div><div class="cardtitle">Recent orders</div><div class="cardsub">Latest activity from all channels</div></div><button class="btn small" data-goto="Orders">View all ↗</button></div>${recent.map(o=>{let c=customer(o.customer);return `<div class="miniorder">${avatar(c)}<div style="min-width:0"><div class="mininame">${esc(c.name)}</div><div class="minimeta">${o.id} · ${fmtDate(o.created)}</div></div><div><div class="amount">${money(o.total)}</div><div style="margin-top:5px;text-align:right">${status(o.status)}</div></div></div>`}).join('')}</section></div><div class="grid bottom-grid"><section class="card"><div class="cardhead"><div><div class="cardtitle">Inventory watch</div><div class="cardsub">Products at or below their reorder point</div></div><button class="btn small" data-goto="Products & Inventory">Manage inventory ↗</button></div>${lowp.length?lowp.map(p=>`<div class="listrow"><div class="productleft"><div class="prodthumb">${p.emoji}</div><div class="prodtext"><strong>${esc(p.name)}</strong><small>${p.sku} · ${p.stock} units left</small><div class="stockbar"><span style="width:${Math.max(9,Math.min(100,p.stock/Math.max(1,p.low)*100))}%"></span></div></div></div><span class="status pending">Reorder</span></div>`).join(''):`<div class="empty">All items are above low-stock thresholds.</div>`}</section><section class="card"><div class="cardhead"><div><div class="cardtitle">Channel activity</div><div class="cardsub">Conversation volume in demo workspace</div></div><button class="btn small" data-goto="Inbox">Open inbox ↗</button></div>${channels.map((ch,i)=>{let n=state.conversations.filter(c=>c.channel===ch).length;let cls=['messenger','instagram','whatsapp'][i];return `<div class="channel-row"><div class="channel-icon ${cls}">${['f','◎','◉'][i]}</div><div><strong>${ch}</strong><small>${ch==='Messenger'?'Facebook Page inbox':ch==='Instagram'?'Instagram Direct':'WhatsApp Business'}</small></div><div class="channel-count">${n}<small> threads</small></div></div>`}).join('')}<div class="noticebox" style="margin:12px 15px 15px">Demo conversations only. No Meta account is connected yet.</div></section></div><div class="footer-note">Sample data only · No live orders, payments or courier bookings are being processed.</div>`}
function renderOrders(){let list=state.orders.filter(o=>orderFilter==='All'||o.status===orderFilter).filter(o=>!globalQuery||`${o.id} ${customer(o.customer).name} ${orderItemNames(o)}`.toLowerCase().includes(globalQuery.toLowerCase()));let actions=btn('＋ Create order','create-order','primary')+`<button class="btn ${orderMode==='table'?'soft':''}" data-action="orders-table">☷ Table</button><button class="btn ${orderMode==='kanban'?'soft':''}" data-action="orders-kanban">▦ Board</button>`;let tools=`<div class="toolbar"><input id="orderSearch" placeholder="Search order, customer…" value="${esc(globalQuery)}"/><select id="orderFilter">${['All',...statuses].map(s=>`<option ${orderFilter===s?'selected':''}>${s}</option>`).join('')}</select><span class="grow"></span><span class="cellmuted">${list.length} orders</span></div>`;let body=orderMode==='table'?`<div class="tablewrap"><table class="data-table"><thead><tr><th>Order</th><th>Customer</th><th>Items</th><th>Total</th><th>Payment</th><th>Status</th><th>Created</th><th></th></tr></thead><tbody>${list.map(o=>{let c=customer(o.customer);return `<tr><td><span class="orderid">${o.id}</span><div class="cellmuted" style="margin-top:4px">${o.courier}</div></td><td class="customer-cell"><strong>${esc(c.name)}</strong><small>${esc(c.location)}</small></td><td style="max-width:210px">${esc(orderItemNames(o))}</td><td><strong>${money(orderTotal(o))}</strong></td><td>${esc(o.payment)}<div style="margin-top:5px">${status(o.paymentStatus)}</div></td><td><select class="select orderstatus" data-id="${o.id}">${statuses.map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select></td><td class="cellmuted">${fmtDate(o.created)}</td><td><button class="btn small" data-action="order-detail" data-id="${o.id}">Details ↗</button></td></tr>`}).join('')}</tbody></table></div>`:`<div class="kanban">${['Pending','Confirmed','Processing','Packed','Shipped','Delivered','Cancelled'].map(s=>{let os=list.filter(o=>o.status===s);return `<div class="kanban-col"><div class="kanban-head">${s}<span class="k-count">${os.length}</span></div>${os.map(o=>`<div class="kanban-card"><span class="orderid">${o.id}</span><strong>${esc(customer(o.customer).name)}</strong><p>${esc(orderItemNames(o))}</p><div class="kanban-cardfoot"><b style="font-size:11px">${money(orderTotal(o))}</b><button class="btn small" data-action="order-detail" data-id="${o.id}">Open</button></div></div>`).join('')||'<div class="cellmuted" style="padding:10px 2px">No orders</div>'}</div>`}).join('')}</div>`;return `${head('COMMERCE OPERATIONS','Orders & fulfilment','Track every order from first confirmation through dispatch and delivery.',actions)}<section class="card">${tools}${body}</section><div class="footer-note">Order changes update shared demo workspace state. Courier booking and payment settlement are not live.</div>`}
function renderProducts(){let list=state.products.filter(p=>productFilter==='All'||p.cat===productFilter).filter(p=>!globalQuery||`${p.name} ${p.sku} ${p.cat}`.toLowerCase().includes(globalQuery.toLowerCase()));return `${head('CATALOG MANAGEMENT','Products & inventory','Keep product availability, variants and reorder thresholds in sync with order processing.',btn('＋ Add product','create-product','primary'))}<section class="card"><div class="toolbar"><input id="productSearch" placeholder="Search product or SKU…" value="${esc(globalQuery)}"/><select id="productFilter">${['All',...new Set(state.products.map(p=>p.cat))].map(s=>`<option ${productFilter===s?'selected':''}>${esc(s)}</option>`).join('')}</select><span class="grow"></span><span class="cellmuted">${state.products.length} products · ${state.products.reduce((a,p)=>a+p.stock,0)} units in stock</span></div><div class="tablewrap"><table class="data-table"><thead><tr><th>Product</th><th>SKU / Category</th><th>Price</th><th>Cost</th><th>Stock on hand</th><th>Status</th><th>Actions</th></tr></thead><tbody>${list.map(p=>`<tr><td><div class="item-title"><div class="prodthumb">${p.emoji}</div><strong>${esc(p.name)}</strong></div></td><td><b>${p.sku}</b><div class="cellmuted" style="margin-top:4px">${esc(p.cat)}</div></td><td><b>${money(p.price)}</b></td><td class="cellmuted">${money(p.cost)}</td><td><b>${p.stock}</b> <span class="cellmuted">/ low at ${p.low}</span><div class="stockbar"><span style="width:${Math.max(4,Math.min(100,p.stock/Math.max(1,p.low*2)*100))}%;background:${p.stock<=p.low?'#e5a242':'#55b995'}"></span></div></td><td>${p.stock<=p.low?status('Pending'):status('Active')}</td><td><div class="cell-actions"><button class="btn small" data-action="edit-product" data-id="${p.id}">Edit</button><button class="btn small" data-action="adjust-stock" data-id="${p.id}">± Stock</button></div></td></tr>`).join('')}</tbody></table></div></section><div class="grid two-col" style="margin-top:15px"><div class="card" style="padding:16px"><div class="cardtitle">Inventory at a glance</div><div class="cardsub">Reorder points and stock adjustments</div><div style="display:flex;gap:20px;margin-top:19px"><div><div class="eyebrow">Low stock</div><div class="kpi-value" style="font-size:24px;margin:7px 0">${state.products.filter(p=>p.stock<=p.low).length}</div></div><div><div class="eyebrow">Total units</div><div class="kpi-value" style="font-size:24px;margin:7px 0">${state.products.reduce((a,p)=>a+p.stock,0)}</div></div><div><div class="eyebrow">Stock value</div><div class="kpi-value" style="font-size:24px;margin:7px 0">${money(state.products.reduce((a,p)=>a+p.cost*p.stock,0))}</div></div></div></div><div class="card" style="padding:16px"><div class="cardtitle">Inventory controls</div><p class="subheading" style="margin-top:8px">Every manual change in this demo is logged locally with a reason. Production stock control must use authenticated server-side transactions.</p>${btn('View audit log','view-audit','')} </div></div>`}
function renderPayments(){let list=state.payments.filter(p=>paymentFilter==='All'||p.status===paymentFilter).filter(p=>!globalQuery||`${p.id} ${p.order} ${p.ref} ${customer(p.customer).name}`.toLowerCase().includes(globalQuery.toLowerCase()));return `${head('PAYMENT RECONCILIATION','Payments & verification','Review customer-submitted MFS references and proof status before confirming orders.',btn('Payment instructions','payment-guide')+btn('Export review list','export-payments'))}<div class="noticebox" style="margin-bottom:14px"><b>Demo / sandbox only.</b> A status change here records a local review decision; it does not verify a real bKash, Nagad or Rocket transaction. Provider verification and secure proof storage must be connected server-side.</div><div class="grid kpis">${kpi('Pending review',state.payments.filter(p=>['Pending','Review'].includes(p.status)).length,'◷','amber','Requires team review')}${kpi('Verified proofs',state.payments.filter(p=>p.status==='Verified').length,'✓','green','Recorded as reviewed')}${kpi('Rejected proofs',state.payments.filter(p=>p.status==='Rejected').length,'×','violet','Keep rejection reason')}${kpi('Submitted amount',money(state.payments.reduce((a,p)=>a+p.amount,0)),'৳','blue','Total demo proof value')}</div><section class="card"><div class="toolbar"><input id="paymentSearch" value="${esc(globalQuery)}" placeholder="Search reference, order, customer…"/><select id="paymentFilter">${['All','Pending','Review','Verified','Rejected'].map(s=>`<option ${paymentFilter===s?'selected':''}>${s}</option>`).join('')}</select><span class="grow"></span><span class="cellmuted">${list.length} payment records</span></div><div class="tablewrap"><table class="data-table"><thead><tr><th>Reference</th><th>Order / customer</th><th>Method</th><th>Amount</th><th>Received</th><th>Status</th><th>Review</th></tr></thead><tbody>${list.map(p=>`<tr><td><b>${p.id}</b><div class="cellmuted" style="margin-top:4px">${esc(p.ref)}</div></td><td><b>${p.order}</b><div class="cellmuted" style="margin-top:4px">${esc(customer(p.customer).name)}</div></td><td>${esc(p.method)}</td><td><b>${money(p.amount)}</b></td><td class="cellmuted">${fmtDate(p.received)} · ${fmtTime(p.received)}</td><td>${status(p.status)}${p.reason?`<div class="cellmuted" style="margin-top:4px">${esc(p.reason)}</div>`:''}</td><td><div class="cell-actions">${['Pending','Review'].includes(p.status)?`<button class="btn small soft" data-action="verify-payment" data-id="${p.id}">Verify</button><button class="btn small danger" data-action="reject-payment" data-id="${p.id}">Reject</button>`:`<button class="btn small" data-action="payment-detail" data-id="${p.id}">Details</button>`}</div></td></tr>`).join('')||'<tr><td colspan="7" class="empty">No payment records match your filters.</td></tr>'}</tbody></table></div></section>`}
function renderShipments(){let list=state.shipments.filter(s=>shipmentFilter==='All'||s.status===shipmentFilter).filter(s=>!globalQuery||`${s.id} ${s.order} ${s.tracking} ${customer(state.orders.find(o=>o.id===s.order)?.customer||'')?.name}`.toLowerCase().includes(globalQuery.toLowerCase()));return `${head('DELIVERY OPERATIONS','Shipments & couriers','Prepare fulfilment handoffs and keep tracking status visible to your team.',btn('Rate defaults','shipping-settings')+btn('＋ Prepare shipment','create-shipment','primary'))}<div class="noticebox" style="margin-bottom:14px">Courier actions are simulated in this demo. Indicative shipping defaults: inside Dhaka ${money(state.merchant.inside)} and outside Dhaka ${money(state.merchant.outside)}. Actual rates depend on courier terms, weight and zone.</div><div class="grid kpis">${kpi('Total shipments',state.shipments.length,'⇢','blue','Demo shipment records')}${kpi('In transit',state.shipments.filter(s=>s.status==='In transit').length,'↗','green','Courier status sample')}${kpi('Booked',state.shipments.filter(s=>s.status==='Booked').length,'◷','amber','Awaiting pickup')}${kpi('Delivered',state.shipments.filter(s=>s.status==='Delivered').length,'✓','violet','Demo deliveries')}</div><section class="card"><div class="toolbar"><input id="shipmentSearch" value="${esc(globalQuery)}" placeholder="Search tracking or order…"/><select id="shipmentFilter">${['All','Booked','In transit','Delivered','Cancelled'].map(s=>`<option ${shipmentFilter===s?'selected':''}>${s}</option>`).join('')}</select><span class="grow"></span></div><div class="tablewrap"><table class="data-table"><thead><tr><th>Shipment</th><th>Order / destination</th><th>Courier</th><th>Tracking / consignment</th><th>Shipping fee</th><th>Status</th><th>Last update</th><th>Action</th></tr></thead><tbody>${list.map(s=>{let o=state.orders.find(o=>o.id===s.order);return `<tr><td><b>${s.id}</b></td><td><b>${s.order}</b><div class="cellmuted" style="margin-top:4px">${esc(o?.city||s.city)}</div></td><td>${esc(s.courier)}</td><td>${esc(s.tracking)}</td><td>${money(s.fee)}</td><td>${status(s.status)}</td><td class="cellmuted">${fmtDate(s.updated)} ${fmtTime(s.updated)}</td><td><button class="btn small" data-action="advance-shipment" data-id="${s.id}" ${s.status==='Delivered'?'disabled':''}>${s.status==='Booked'?'Mark in transit':s.status==='In transit'?'Mark delivered':'Details'}</button></td></tr>`}).join('')}</tbody></table></div></section><div class="grid two-col" style="margin-top:15px"><div class="card policy-card"><h3>Courier adapter status</h3>${['Pathao','Steadfast','Shiprocket'].map((c,i)=>`<div class="switchrow"><div><strong>${c}</strong><small>${i===0?'Local courier adapter planned':i===1?'Local courier adapter planned':'Extensible provider adapter planned'}</small></div>${status('Pending')}</div>`).join('')}</div><div class="card policy-card"><h3>Shipment workflow</h3><div class="progressstep"><span class="stepdot done">1</span><span>Confirm order address and contact number</span></div><div class="progressstep"><span class="stepdot done">2</span><span>Calculate the indicative zone fee</span></div><div class="progressstep"><span class="stepdot">3</span><span>Book label via server-side courier adapter</span></div><div class="progressstep"><span class="stepdot">4</span><span>Sync webhooks and delivery events</span></div></div></div>`}
function renderCustomers(){let list=state.customers.filter(c=>!globalQuery||`${c.name} ${c.location} ${c.phone} ${c.tags.join(' ')}`.toLowerCase().includes(globalQuery.toLowerCase()));return `${head('CUSTOMER RELATIONSHIPS','Customers','A single view of customer context, purchase history and social conversations.',btn('Export customer list','export-customers'))}<section class="card"><div class="toolbar"><input id="customerSearch" value="${esc(globalQuery)}" placeholder="Search name, location or phone…"/><span class="grow"></span><span class="cellmuted">${list.length} customers</span></div><div class="tablewrap"><table class="data-table"><thead><tr><th>Customer</th><th>Location</th><th>Phone</th><th>Orders</th><th>Lifetime spend</th><th>Segment</th><th>History</th></tr></thead><tbody>${list.map(c=>`<tr><td><div class="item-title">${avatar(c)}<strong>${esc(c.name)}</strong></div></td><td>${esc(c.location)}</td><td class="cellmuted">${esc(c.phone)}</td><td>${c.orders}</td><td><b>${money(c.spend)}</b></td><td>${c.tags.map(t=>`<span class="tag" style="font-size:9px">${esc(t)}</span>`).join(' ')}</td><td><button class="btn small" data-action="customer-history" data-id="${c.id}">View profile ↗</button></td></tr>`).join('')}</tbody></table></div></section><div class="noticebox" style="margin-top:14px">Demo customer data only. Production customer information should be access-controlled, minimized in list views and governed by a retention policy.</div>`}
function renderAnalytics(){const days=analyticsRange==='Last 7 days'?7:analyticsRange==='Last 30 days'?30:31;const reportOrders=state.orders.filter(o=>(Date.now()-new Date(o.created).getTime())/86400000<=days);const delivered=reportOrders.filter(o=>o.status==='Delivered');const total=reportOrders.reduce((a,o)=>a+orderTotal(o),0);const byStatus=statuses.map(s=>({s,n:reportOrders.filter(o=>o.status===s).length}));const byMethod=['bKash','Nagad','Rocket','Cash on Delivery'].map(s=>({s,n:reportOrders.filter(o=>o.payment===s).length}));let top=[...state.products].map(p=>({...p,qty:reportOrders.reduce((a,o)=>a+o.items.filter(i=>i[0]===p.id).reduce((b,i)=>b+i[1],0),0)})).sort((a,b)=>b.qty-a.qty).slice(0,5);return `${head('BUSINESS INTELLIGENCE','Analytics','Track the operational signals that matter across your social-commerce workflow.',`<select class="select" id="analyticsRange">${['Last 7 days','Last 30 days','This month'].map(s=>`<option ${analyticsRange===s?'selected':''}>${s}</option>`).join('')}</select>${btn('Download summary','export-analytics')}`)}<div class="grid kpis">${kpi('Total order value',money(total),'৳','green','All demo order statuses')}${kpi('Delivered sales',money(delivered.reduce((a,o)=>a+o.total,0)),'✓','blue','Delivered demo orders')}${kpi('Average order value',money(total/Math.max(1,reportOrders.length)),'⌁','violet','Across current sample')}${kpi('Order completion',Math.round(delivered.length/Math.max(1,reportOrders.length)*100)+'%','↗','amber','Delivered / all orders')}</div><div class="grid two-col"><section class="card"><div class="cardhead"><div><div class="cardtitle">Order status mix</div><div class="cardsub">Current orders by workflow stage</div></div></div><div style="padding:0 19px 20px">${byStatus.map(x=>`<div style="margin:14px 0"><div style="display:flex;justify-content:space-between;font-size:10px;margin-bottom:6px"><span>${x.s}</span><b>${x.n}</b></div><div style="height:7px;background:#eff2f6;border-radius:8px;overflow:hidden"><div style="height:100%;width:${x.n/Math.max(1,reportOrders.length)*100}%;background:${({'Pending':'#e1a43d','Confirmed':'#47ad8c','Processing':'#6475e8','Packed':'#8367c6','Shipped':'#51a5cf','Delivered':'#1a8766','Cancelled':'#d67b7b'})[x.s]};border-radius:8px"></div></div></div>`).join('')}</div></section><section class="card"><div class="cardhead"><div><div class="cardtitle">Payment method mix</div><div class="cardsub">Payment methods selected on orders</div></div></div><div style="padding:0 19px 20px">${byMethod.map((x,i)=>`<div style="display:flex;align-items:center;gap:11px;padding:14px 0;border-bottom:1px solid #f0f2f5"><div class="kpi-icon ${['green','blue','violet','amber'][i]}">${['৳','N','R','▣'][i]}</div><div style="flex:1;font-size:11px;font-weight:700">${x.s}<div class="stockbar" style="width:100%;margin-top:7px"><span style="width:${x.n/Math.max(1,reportOrders.length)*100}%;background:${['#259575','#596be8','#8969d0','#e3a044'][i]}"></span></div></div><b>${x.n}</b></div>`).join('')}</div></section><section class="card"><div class="cardhead"><div><div class="cardtitle">Top products</div><div class="cardsub">Quantity included in current sample orders</div></div></div>${top.map(p=>`<div class="listrow"><div class="productleft"><div class="prodthumb">${p.emoji}</div><div class="prodtext"><strong>${esc(p.name)}</strong><small>${p.sku}</small></div></div><b>${p.qty} units</b></div>`).join('')}</section><section class="card"><div class="cardhead"><div><div class="cardtitle">Channel mix</div><div class="cardsub">Conversation counts in demo inbox</div></div></div>${channels.map((ch,i)=>`<div class="channel-row"><div class="channel-icon ${['messenger','instagram','whatsapp'][i]}">${['f','◎','◉'][i]}</div><div><strong>${ch}</strong><small>Demo conversations</small></div><div class="channel-count">${state.conversations.filter(c=>c.channel===ch).length}</div></div>`).join('')}</section></div><div class="footer-note">Charts summarize local sample data. For production reporting use server-side aggregated, tenant-scoped records.</div>`}
function renderAI(){return `${head('AUTOMATION & CUSTOMER EXPERIENCE','AI Agent','Configure an assistant that can answer common questions and escalate sensitive cases.',btn('Save AI settings','save-ai','primary'))}<div class="noticebox" style="margin-bottom:14px"><b>AI preview only.</b> No live LLM or LangGraph agent is connected. This page stores demo policy settings locally and previews a rule-based reply; it does not send customer messages automatically.</div><div class="grid two-col"><section class="card policy-card"><div style="display:flex;justify-content:space-between;align-items:flex-start"><div><h3>Agent behavior</h3><p>Set the language, tone and routing behavior for future assistant integration.</p></div><button class="switch ${state.ai.enabled?'on':''}" id="aiEnabled" aria-label="Toggle AI agent" aria-pressed="${state.ai.enabled}"></button></div><div class="fieldrow"><div class="field"><label>Preferred language</label><select id="aiLanguage"><option ${state.ai.language==='Bangla + Banglish'?'selected':''}>Bangla + Banglish</option><option ${state.ai.language==='Bangla'?'selected':''}>Bangla</option><option ${state.ai.language==='English'?'selected':''}>English</option></select></div><div class="field"><label>Reply tone</label><select id="aiTone"><option ${state.ai.tone==='Warm and helpful'?'selected':''}>Warm and helpful</option><option>Professional and concise</option><option>Friendly and conversational</option></select></div></div><div class="field" style="margin-top:14px"><label>Human escalation triggers</label><textarea id="aiEscalation">${esc(state.ai.escalation)}</textarea></div><div class="switchrow"><div><strong>Human approval before sending</strong><small>Recommended for any real customer-facing AI.</small></div><button class="switch on" disabled aria-label="Human approval enabled"></button></div><div class="switchrow"><div><strong>Use only approved FAQs and policies</strong><small>Ground replies in merchant-provided facts.</small></div><button class="switch on" disabled aria-label="Policy grounding enabled"></button></div></section><section class="card policy-card"><h3>Reply preview playground</h3><p>Try a typical question. The preview uses only the demo FAQ below.</p><div class="field"><label>Customer question</label><textarea id="aiQuestion" placeholder="e.g. Dhakay delivery charge koto?">ঢাকার ভিতরে ডেলিভারি চার্জ কত?</textarea></div><button class="btn primary" style="margin-top:10px" data-action="ai-preview">Generate demo reply ✧</button><div id="aiAnswer" style="margin-top:15px;padding:13px;border-radius:11px;background:#f5f7fb;border:1px solid #e8edf3;font-size:11px;line-height:1.7;color:#5a6679">Your sample answer will appear here. No message will be sent to a customer.</div></section><section class="card policy-card" style="grid-column:1/-1"><h3>Business FAQs & policies</h3><p>Write approved answers that the future LangGraph agent may retrieve as grounded context.</p><textarea id="aiFaqs">${esc(state.ai.faqs)}</textarea><div style="display:flex;justify-content:flex-end;margin-top:10px">${btn('Save FAQs','save-ai','primary')}</div></section></div>`}
function renderIntegrations(){let items=[['Meta Messenger','f','messenger','Receive and reply to Facebook Page messages via Meta webhooks.'],['Instagram','◎','instagram','Support Instagram Direct messaging for eligible professional accounts.'],['WhatsApp Cloud API','◉','whatsapp','Connect a WhatsApp Business number and approved messaging flows.'],['bKash','৳','green','Transaction verification must use official, authorized provider APIs.'],['Nagad','N','amber','Reconcile transaction references through a supported provider workflow.'],['Rocket','R','violet','Keep payment references unique and process events idempotently.'],['Pathao','P','blue','Live shipping rates, booking and tracking via server-side adapter.'],['Steadfast','S','green','Booking requests and tracking webhook integration.'],['Shiprocket','↗','blue','Optional, extensible courier adapter for eligible routes.'],['AI provider','✧','violet','Server-side LLM + LangGraph execution and audit records.']];return `${head('CONNECTED SERVICES','Integrations','Connect the channels and providers that power your real workflows.',btn('Setup checklist','setup-checklist','primary'))}<div class="noticebox" style="margin-bottom:15px">All providers currently show as <b>Not connected</b> or <b>Demo mode</b>. Never paste access tokens or provider secrets into this browser demo. Production credentials belong in a server-side secret manager.</div><div class="grid integration-grid">${items.map(([name,letter,color,desc],i)=>`<section class="card integration-card"><div class="integration-head"><div class="integration-logo ${color}" style="${color==='green'?'background:#e5f6ef;color:#1a8466':color==='amber'?'background:#fff4db;color:#aa7417':color==='violet'?'background:#f1ebff;color:#805ac4':color==='blue'?'background:#edf0ff;color:#4f63d8':color==='messenger'?'background:#edf0ff;color:#5264d7':color==='instagram'?'background:#ffedf2;color:#c84d88':color==='whatsapp'?'background:#e5f6eb;color:#218e57':''}">${letter}</div>${status('Pending')}</div><h3>${name}</h3><p>${desc}</p><div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:auto"><span class="cellmuted">Not connected</span><button class="btn small" data-action="integration-guide" data-name="${name}">Setup guide ↗</button></div></section>`).join('')}</div><section class="card" style="padding:18px;margin-top:15px"><div class="cardtitle">Webhook security checklist</div><div class="grid two-col" style="margin-top:10px">${['Verify Meta webhook signatures using HMAC-SHA256 on the raw request body.','Deduplicate provider events and enforce idempotency keys server-side.','Keep access tokens and signing secrets out of browser bundles and logs.','Return fast webhook acknowledgements; hand work off to a durable job queue.'].map((t,i)=>`<div class="progressstep"><span class="stepdot">${i+1}</span><span>${t}</span></div>`).join('')}</div></section>`}
function renderSettings(){return `${head('WORKSPACE ADMINISTRATION','Settings','Manage merchant defaults, demo-team roles and an auditable operational trail.',btn('Save business profile','save-settings','primary'))}<div class="settingsgrid"><section class="card settingsnav">${['Business profile','Shipping defaults','Team & permissions','Notifications','Audit log','Architecture roadmap'].map(x=>`<button class="${settingsTab===x?'active':''}" data-action="settings-tab" data-tab="${x}">${x}</button>`).join('')}</section><section class="card settingscontent">${settingsTab==='Business profile'?`<div class="cardtitle">Merchant information</div><p class="subheading" style="margin:6px 0 20px">Used in workspace labels and business reporting.</p><div class="grid two-col"><div class="field"><label>Store / merchant name</label><input id="settingMerchant" value="${esc(state.merchant.name)}"/></div><div class="field"><label>Workspace region</label><select disabled><option>Bangladesh</option></select></div><div class="field"><label>Currency</label><input value="BDT — Bangladeshi Taka (৳)" disabled/></div><div class="field"><label>Timezone</label><input value="${esc(state.merchant.timezone)}" disabled/></div></div><div class="noticebox" style="margin-top:19px">This is a local demo workspace. Production authentication, tenant isolation and permissions must be enforced by a server-side identity and database layer.</div>`:settingsTab==='Shipping defaults'?`<div class="cardtitle">Indicative shipping defaults</div><p class="subheading" style="margin:6px 0 20px">These values are editable planning defaults, not real-time courier rates.</p><div class="grid two-col"><div class="field"><label>Inside Dhaka (BDT)</label><input id="settingInside" type="number" min="0" value="${state.merchant.inside}"/></div><div class="field"><label>Outside Dhaka (BDT)</label><input id="settingOutside" type="number" min="0" value="${state.merchant.outside}"/></div></div><p class="subheading" style="margin-top:15px">Future shipping calculator should use zone, parcel weight, COD and provider response, with the final quote stored on an order.</p>`:settingsTab==='Team & permissions'?`<div class="cardtitle">Team access model</div><p class="subheading" style="margin:6px 0 15px">Illustrative roles only — these are not enforced user accounts.</p>${[['Arafat Rifat','Owner','Full workspace administration'],['Nabila Akter','Agent','Inbox, customer and order operations'],['System reviewer','Admin','Payments and audit review']].map(([n,r,d])=>`<div class="listrow"><div class="prodtext"><strong>${n}</strong><small>${d}</small></div><span class="tag">${r}</span></div>`).join('')}<div class="noticebox" style="margin-top:16px">Do not treat frontend visibility as authorization. Every merchant-owned read and write must be tenant-scoped on the server.</div>`:settingsTab==='Notifications'?`<div class="cardtitle">Workspace notifications</div><p class="subheading" style="margin:6px 0 15px">Preview preferences for a future notification service.</p>${[['New conversation','Notify on inbound customer messages'],['Payment review needed','Notify owner and assigned reviewer'],['Low stock alert','Notify when stock crosses reorder point'],['Shipment exception','Notify on courier delivery exception']].map(([n,d])=>`<div class="switchrow"><div><strong>${n}</strong><small>${d}</small></div><button class="switch on" data-action="toggle-switch"></button></div>`).join('')}`:settingsTab==='Audit log'?`<div class="cardtitle">Recent activity</div><p class="subheading" style="margin:6px 0 12px">Local demo audit entries generated by this browser session.</p>${state.audit.slice().sort((a,b)=>new Date(b.at)-new Date(a.at)).map(a=>`<div class="listrow"><div class="prodtext"><strong>${esc(a.action)}</strong><small>${esc(a.actor)} · ${esc(a.target)}</small></div><span class="cellmuted">${fmtDate(a.at)} ${fmtTime(a.at)}</span></div>`).join('')}`:`<div class="cardtitle">Phased implementation roadmap</div><p class="subheading" style="margin:6px 0 15px">Move from local demo flows to a secure multi-tenant production platform in controlled increments.</p>${[['Phase 1 — Operations MVP','App shell, demo workspace, inbox, products, orders, payment review and shipment flows.','In progress'],['Phase 2 — Meta channels','Webhook HMAC validation, deduplication and real inbound/outbound messaging after provider setup.','Planned'],['Phase 3 — LangGraph AI','FAQ-grounded Bangla/Banglish agent, allowlisted tools, thresholds and human escalation.','Planned'],['Phase 4 — MFS verification','Secure proof storage/OCR and provider verification where authorized, anti-replay controls.','Planned'],['Phase 5 — Courier adapters','Pathao/Steadfast/Shiprocket live rates, booking, tracking and retries.','Planned'],['Phase 6 — Production hardening','AuthZ, tenant-isolation tests, rate limits, logs, backups, privacy, retention and accessibility.','Planned']].map(([n,d,s],i)=>`<div class="listrow"><div style="display:flex;gap:11px;align-items:flex-start"><div class="stepdot ${i===0?'done':''}">${i+1}</div><div class="prodtext"><strong>${n}</strong><small style="max-width:560px;line-height:1.5">${d}</small></div></div>${s==='In progress'?status('Review'):'<span class="status neutral">Planned</span>'}</div>`).join('')}`}<div style="display:flex;justify-content:flex-end;margin-top:20px">${btn('Save settings','save-settings','primary')}</div></section></div>`}
function renderInbox(){let list=state.conversations.filter(c=>inboxChannel==='All'||c.channel===inboxChannel).filter(c=>inboxFilter==='All'||(inboxFilter==='Unread'?c.unread:inboxFilter==='Needs human'?c.status==='Needs human':inboxFilter==='Resolved'?c.status==='Resolved':c.assigned!=='Unassigned')).filter(c=>!globalQuery||`${customer(c.customer).name} ${c.messages.map(m=>m.text).join(' ')}`.toLowerCase().includes(globalQuery.toLowerCase()));if(!selectedConversation||!list.some(c=>c.id===selectedConversation))selectedConversation=list[0]?.id||null;let c=state.conversations.find(c=>c.id===selectedConversation),cu=c?customer(c.customer):null;return `${head('CUSTOMER CONVERSATIONS','Unified inbox','One workspace for social conversations, customer context and human handoff.',btn('Quick replies','quick-replies')+btn('Inbox settings','goto-Integrations'))}<div class="card inbox-layout"><section class="inbox-list ${mobileInboxView==='chat'?'hidden-mobile':''}"><div class="inbox-toolbar"><input id="inboxSearch" value="${esc(globalQuery)}" placeholder="Search conversations…"/><div class="filterchips">${['All','Unread','Assigned','Needs human','Resolved'].map(s=>`<button class="chip ${inboxFilter===s?'active':''}" data-action="inbox-filter" data-filter="${s}">${s}</button>`).join('')}</div><div class="filterchips" style="margin-top:8px">${['All',...channels].map(s=>`<button class="chip ${inboxChannel===s?'active':''}" data-action="inbox-channel" data-channel="${s}">${s}</button>`).join('')}</div></div>${list.map(conv=>{let cc=customer(conv.customer),last=conv.messages.at(-1);return `<div class="threadrow ${conv.id===selectedConversation?'active':''}" data-action="select-conversation" data-id="${conv.id}">${avatar(cc)}<div class="threadinfo"><div class="threadtop"><strong>${esc(cc.name)} ${conv.unread?'<i class="unread"></i>':''}</strong><span class="threadtime">${fmtTime(conv.updated)}</span></div><div class="threadmsg">${esc(last?.text||'No message')}</div><div class="threadtags"><span class="tag">${conv.channel}</span><span class="tag">${conv.status}</span></div></div></div>`}).join('')||'<div class="empty">No conversations match filters.</div>'}</section><section class="chatpanel ${mobileInboxView==='list'?'hidden-mobile':''}">${c?`<div class="chathead"><div style="display:flex;align-items:center;gap:9px"><button class="btn small inbox-back" data-action="inbox-back" style="display:none">←</button>${avatar(cu)}<div><strong>${esc(cu.name)}</strong><small>${c.channel} · ${esc(c.status)} · ${esc(c.assigned)}</small></div></div><div style="display:flex;gap:6px"><button class="btn small" data-action="assign-thread" data-id="${c.id}">Assign</button><button class="btn small" data-action="toggle-thread-status" data-id="${c.id}">${c.status==='Resolved'?'Reopen':'Resolve'}</button></div></div><div class="chatmessages">${c.messages.map(m=>`<div class="message ${m.from==='seller'?'out':m.from==='note'?'note':''}"><div class="bubble">${esc(m.text)}</div><span class="msgmeta">${m.from==='customer'?'Customer':m.from==='note'?'Internal note':'Bongo Kori team'} · ${fmtTime(m.at)}</span></div>`).join('')}</div><div class="composer"><div class="compose-tools"><label><input type="checkbox" id="internalNote"/> Add internal note</label><button class="btn small" data-action="quick-replies">Quick reply ▾</button></div><textarea id="messageComposer" placeholder="Write in Bangla, Banglish or English…"></textarea><div class="composerfoot"><span>Demo thread · No message leaves this browser</span><button class="btn primary small" data-action="send-message" data-id="${c.id}">Send reply ↗</button></div></div>`:`<div class="empty">Select a conversation to view messages.</div>`}</section><aside class="customerpanel">${cu?`<div class="customer-hero">${avatar(cu)}<strong>${esc(cu.name)}</strong><small>${esc(cu.location)}</small></div><div class="detail-label">Customer details</div><div class="detailline"><span>Phone</span><strong>${esc(cu.phone)}</strong></div><div class="detailline"><span>Total orders</span><strong>${cu.orders}</strong></div><div class="detailline"><span>Lifetime spend</span><strong>${money(cu.spend)}</strong></div><div class="detail-label">Recent orders</div>${state.orders.filter(o=>o.customer===cu.id).slice(0,3).map(o=>`<div style="padding:8px 0;border-bottom:1px solid #eef1f5"><div style="display:flex;justify-content:space-between;gap:5px"><b style="font-size:10px">${o.id}</b><span style="font-size:10px">${money(o.total)}</span></div><div style="margin-top:6px">${status(o.status)}</div></div>`).join('')||'<div class="cellmuted">No order history</div>'}<div class="detail-label">Assigned agent</div><div class="detailline"><span>Owner</span><strong>${esc(c.assigned)}</strong></div><div class="detail-label">Actions</div><button class="btn small" style="width:100%" data-action="customer-history" data-id="${cu.id}">View customer profile ↗</button>`:''}</aside></div><div class="footer-note">Demo inbox data only · Sending updates local state and never contacts a real customer.</div>`}
function render(){let html=({'Overview':renderOverview,'Inbox':renderInbox,'Orders':renderOrders,'Products & Inventory':renderProducts,'Payments':renderPayments,'Shipments':renderShipments,'Customers':renderCustomers,'Analytics':renderAnalytics,'AI Agent':renderAI,'Integrations':renderIntegrations,'Settings':renderSettings})[page]?.()||renderOverview();document.getElementById('content').innerHTML=html;updateBadges()}
function addAudit(action,target){state.audit.push({id:'AU-'+Date.now(),actor:'Arafat',action,target,at:iso(new Date())})}
function openModal(title,body,submitText,onSubmit){document.getElementById('modalRoot').innerHTML=`<div class="modalback" data-action="close-modal"><form class="modal" id="activeModal"><div class="modalhead"><h2>${title}</h2><button class="iconbtn" type="button" data-action="close-modal" aria-label="Close">×</button></div><div class="modalbody">${body}</div><div class="modalfoot"><button class="btn" type="button" data-action="close-modal">Cancel</button><button class="btn primary" type="submit">${submitText}</button></div></form></div>`;document.getElementById('activeModal').addEventListener('submit',e=>{e.preventDefault();if(onSubmit()!==false){document.getElementById('modalRoot').innerHTML=''}})}function closeModal(){document.getElementById('modalRoot').innerHTML=''}function createOrderModal(){openModal('Create demo order',`<div class="noticebox">This creates a local demo order. Inventory is not automatically deducted until you confirm the relevant operational policy.</div><div class="field"><label>Customer</label><select id="newOrderCustomer" required>${state.customers.map(c=>`<option value="${c.id}">${esc(c.name)} — ${esc(c.location)}</option>`).join('')}</select></div><div class="field"><label>Product</label><select id="newOrderProduct" required>${state.products.filter(p=>p.active).map(p=>`<option value="${p.id}">${esc(p.name)} — ${money(p.price)} (${p.stock} in stock)</option>`).join('')}</select></div><div class="fieldrow"><div class="field"><label>Quantity</label><input type="number" id="newOrderQty" value="1" min="1" max="50" required/></div><div class="field"><label>Destination zone</label><select id="newOrderZone"><option value="dhaka">Inside Dhaka · ${money(state.merchant.inside)}</option><option value="outside">Outside Dhaka · ${money(state.merchant.outside)}</option></select></div></div><div class="field"><label>Payment method</label><select id="newOrderPayment"><option>bKash</option><option>Nagad</option><option>Rocket</option><option>Cash on Delivery</option></select></div><div class="field"><label>Delivery address</label><input id="newOrderAddress" placeholder="House, road, area, district" required/></div>`,`Create order`,()=>{let pid=document.getElementById('newOrderProduct').value,cid=document.getElementById('newOrderCustomer').value,q=Number(document.getElementById('newOrderQty').value),zone=document.getElementById('newOrderZone').value,p=product(pid),c=customer(cid);if(!Number.isInteger(q)||q<1||q>50)return toast('Enter a quantity from 1 to 50.','error'),false;if(p.stock<q)return toast('Quantity exceeds current stock.','error'),false;let id='FC-'+(1049+state.orders.length-12).toString();while(state.orders.some(o=>o.id===id))id='FC-'+(Number(id.slice(3))+1);let shipping=zone==='dhaka'?Number(state.merchant.inside):Number(state.merchant.outside),addr=document.getElementById('newOrderAddress').value.trim();if(!addr)return toast('Enter a delivery address.','error'),false;let o={id,customer:cid,items:[[pid,q]],subtotal:p.price*q,shipping,total:p.price*q+shipping,status:'Pending',payment:document.getElementById('newOrderPayment').value,paymentStatus:'Pending',courier:zone==='dhaka'?'Pathao':'Steadfast',city:zone==='dhaka'?'Dhaka':'Outside Dhaka',address:addr,created:iso(new Date()),note:''};state.orders.unshift(o);addAudit('Created demo order',id);save();go('Orders');toast(`${id} created in demo mode.`);return true})}
function editProductModal(p){let editing=!!p;openModal(editing?'Edit product':'Add product',`<div class="field"><label>Product name</label><input id="pName" required value="${esc(p?.name||'')}" placeholder="e.g. Handloom scarf"/></div><div class="fieldrow"><div class="field"><label>SKU</label><input id="pSku" required value="${esc(p?.sku||'')}" placeholder="SKU-001"/></div><div class="field"><label>Category</label><input id="pCat" required value="${esc(p?.cat||'Fashion')}"/></div></div><div class="fieldrow"><div class="field"><label>Selling price (BDT)</label><input id="pPrice" type="number" min="0" step="1" required value="${p?.price??''}"/></div><div class="field"><label>Unit cost (BDT)</label><input id="pCost" type="number" min="0" step="1" required value="${p?.cost??''}"/></div></div><div class="fieldrow"><div class="field"><label>Stock on hand</label><input id="pStock" type="number" min="0" step="1" required value="${p?.stock??0}"/></div><div class="field"><label>Low-stock threshold</label><input id="pLow" type="number" min="0" step="1" required value="${p?.low??5}"/></div></div><div class="field"><label>Emoji thumbnail</label><input id="pEmoji" value="${esc(p?.emoji||'📦')}"/></div>`,editing?'Save changes':'Add product',()=>{let name=document.getElementById('pName').value.trim(),sku=document.getElementById('pSku').value.trim(),cat=document.getElementById('pCat').value.trim(),price=Number(document.getElementById('pPrice').value),cost=Number(document.getElementById('pCost').value),stock=Number(document.getElementById('pStock').value),low=Number(document.getElementById('pLow').value),emoji=document.getElementById('pEmoji').value||'📦';if(!name||!sku||!cat||![price,cost,stock,low].every(Number.isFinite)||[price,cost,stock,low].some(n=>n<0)||![stock,low].every(Number.isInteger))return toast('Check fields. Prices and stock must be valid non-negative numbers.','error'),false;if(state.products.some(x=>x.sku.toLowerCase()===sku.toLowerCase()&&x.id!==p?.id))return toast(' function stockModal(p){openModal('Adjust inventory',`<div class="productleft"><div class="prodthumb">${p.emoji}</div><div class="prodtext"><strong>${esc(p.name)}</strong><small>${p.sku} · Current stock: ${p.stock}</small></div></div><div class="field"><label>Adjustment</label><select id="stockType"><option value="add">Add stock (+)</option><option value="remove">Remove stock (−)</option><option value="set">Set exact stock</option></select></div><div class="field"><label>Quantity</label><input id="stockQty" type="number" min="0" step="1" value="1" required/></div><div class="field"><label>Reason for adjustment</label><select id="stockReason"><option>Restock received</option><option>Damaged / lost</option><option>Stock count correction</option><option>Return received</option><option>Other</option></select></div>`,`Save adjustment`,()=>{let q=Number(document.getElementById('stockQty').value),type=document.getElementById('stockType').value;if(!Number.isInteger(q)||q<0)return toast('Enter a valid non-negative quantity.','error'),false;let next=type==='add'?p.stock+q:type==='remove'?p.stock-q:q;if(next<0)return toast('Stock cannot become negative.','error'),false;p.stock=next;addAudit(`Inventory adjustment: ${document.getElementById('stockReason').value}`,`${p.sku} · ${type==='add'?'+':type==='remove'?'-':'='}${q}`);save();go('Products & Inventory');toast('Inventory updated in demo data.');return true})}
function orderDetail(id){let o=state.orders.find(x=>x.id===id);if(!o)return;let c=customer(o.customer);openModal(`Order ${o.id}`,`<div style="display:flex;justify-content:space-between;align-items:center"><div><div class="cardtitle">${esc(c.name)}</div><div class="cardsub">${esc(c.phone)} · ${esc(c.location)}</div></div>${status(o.status)}</div><div class="detail-label">Items</div>${o.items.map(([id,q])=>`<div class="listrow" style="padding:10px 0"><div class="prodtext"><strong>${esc(product(id).name)} × ${q}</strong><small>${product(id).sku}</small></div><b>${money(product(id).price*q)}</b></div>`).join('')}<div class="detailline"><span>Subtotal</span><strong>${money(orderSubtotal(o))}</strong></div><div class="detailline"><span>Shipping</span><strong>${money(o.shipping)}</strong></div><div class="detailline"><span>Total</span><strong>${money(orderTotal(o))}</strong></div><div class="detailline"><span>Payment</span><strong>${esc(o.payment)} / ${esc(o.paymentStatus)}</strong></div><div class="detailline"><span>Courier</span><strong>${esc(o.courier)}</strong></div><div class="detail-label">Delivery address</div><p class="subheading">${esc(o.address)}</p><div class="field"><label>Change order status</label><select id="detailOrderStatus">${statuses.map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label>Internal note</label><textarea id="detailOrderNote">${esc(o.note)}</textarea></div><div class="noticebox">Demo order record. Real stock reservation, refund, fulfillment and payment actions require server-side transactions and provider integrations.</div>`,`Save order`,()=>{let s=document.getElementById('detailOrderStatus').value;let allowed=validTransition(o.status,s);if(!allowed.ok)return toast(allowed.msg,'error'),false;o.status=s;o.note=document.getElementById('detailOrderNote').value;addAudit('Changed order status',`${o.id} → ${s}`);save();go('Orders');toast('Order updated.');return true})}
function validTransition(from,to){if(from===to)return {ok:true};if(['Delivered','Cancelled'].includes(from))return {ok:false,msg:'Delivered or cancelled orders are locked in this demo.'};const allowed={Pending:['Confirmed','Cancelled'],Confirmed:['Processing','Cancelled'],Processing:['Packed','Cancelled'],Packed:['Shipped','Cancelled'],Shipped:['Delivered']};if(!(allowed[from]||[]).includes(to))return {ok:false,msg:`Invalid transition from ${from} to ${to}. Move the order through the next fulfilment stage.`};return {ok:true}}
